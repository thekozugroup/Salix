<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="title desc">
<title id="title">Validated real Salix fixture convergence</title>
<desc id="desc">Two measured chart lines show recursive drafts converging toward a benchmark style profile.</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="40" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933">Validated real Salix fixture</text>
<text x="40" y="64" font-family="Arial, sans-serif" font-size="13" fill="#52616b">Generated from scripts/demo_convergence.py; tested for decreasing total distance and feature convergence.</text>
<text x="64" y="106" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2933">Comma cadence convergence</text>
<text x="64" y="126" font-family="Arial, sans-serif" font-size="12" fill="#52616b">commas per 1,000 words</text>
<line x1="64" y1="274" x2="856" y2="274" stroke="#c9d1d9" stroke-width="1"/>
<line x1="64" y1="136" x2="64" y2="274" stroke="#c9d1d9" stroke-width="1"/>
<polyline points="64.0,166.9 328.0,166.9 592.0,166.9 856.0,166.9" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="64.0,260.6 328.0,194.2 592.0,185.6 856.0,149.4" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="308" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">Draft line</text>
<text x="160" y="308" font-family="Arial, sans-serif" font-size="12" fill="#b45309">Benchmark line</text>
<text x="64.0" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">0</text>
<text x="328.0" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">1</text>
<text x="592.0" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">2</text>
<text x="856.0" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">3</text>
<text x="64" y="356" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2933">Sentence length convergence</text>
<text x="64" y="376" font-family="Arial, sans-serif" font-size="12" fill="#52616b">words per sentence</text>
<line x1="64" y1="524" x2="856" y2="524" stroke="#c9d1d9" stroke-width="1"/>
<line x1="64" y1="386" x2="64" y2="524" stroke="#c9d1d9" stroke-width="1"/>
<polyline points="64.0,436.3 328.0,436.3 592.0,436.3 856.0,436.3" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="64.0,510.6 328.0,479.9 592.0,399.4 856.0,438.8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="558" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">Draft line</text>
<text x="160" y="558" font-family="Arial, sans-serif" font-size="12" fill="#b45309">Benchmark line</text>
<text x="64.0" y="542" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">0</text>
<text x="328.0" y="542" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">1</text>
<text x="592.0" y="542" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">2</text>
<text x="856.0" y="542" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52616b">3</text>
</svg>
