<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" role="img" aria-labelledby="title desc">
<title id="title">Validated Sherlock Holmes Salix convergence</title>
<desc id="desc">Two measured chart lines show recursive Baker Street drafts converging toward a public-domain Sherlock Holmes benchmark style profile.</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="40" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933">Validated Sherlock Holmes fixture</text>
<text x="40" y="64" font-family="Arial, sans-serif" font-size="13" fill="#52616b">Generated from scripts/demo_convergence.py; tested for decreasing total distance and feature convergence.</text>
<rect x="64.0" y="92" width="253.3" height="170" rx="6" fill="#ffffff" stroke="#d8dee4"/>
<text x="78.0" y="118" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2933">Base prompt only</text>
<text x="78.0" y="142" font-family="Arial, sans-serif" font-size="11" fill="#52616b">Holmes received a note about a missing</text>
<text x="78.0" y="158" font-family="Arial, sans-serif" font-size="11" fill="#52616b">railway ticket. He checked the details,</text>
<text x="78.0" y="174" font-family="Arial, sans-serif" font-size="11" fill="#52616b">compared the times, and realized the</text>
<text x="78.0" y="190" font-family="Arial, sans-serif" font-size="11" fill="#52616b">ticket had never been stolen. The</text>
<text x="78.0" y="206" font-family="Arial, sans-serif" font-size="11" fill="#52616b">answer was hidden in the passenger's</text>
<text x="78.0" y="222" font-family="Arial, sans-serif" font-size="11" fill="#52616b">route.</text>
<rect x="333.3" y="92" width="253.3" height="170" rx="6" fill="#ffffff" stroke="#d8dee4"/>
<text x="347.3" y="118" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2933">Prompt plus "write in the style of Sherlock Holmes"</text>
<text x="347.3" y="142" font-family="Arial, sans-serif" font-size="11" fill="#52616b">In the dim light of Baker Street,</text>
<text x="347.3" y="158" font-family="Arial, sans-serif" font-size="11" fill="#52616b">Holmes turned the railway ticket</text>
<text x="347.3" y="174" font-family="Arial, sans-serif" font-size="11" fill="#52616b">between his long fingers and gave one</text>
<text x="347.3" y="190" font-family="Arial, sans-serif" font-size="11" fill="#52616b">of those thin smiles which usually</text>
<text x="347.3" y="206" font-family="Arial, sans-serif" font-size="11" fill="#52616b">meant the matter had already resolved</text>
<text x="347.3" y="222" font-family="Arial, sans-serif" font-size="11" fill="#52616b">itself in his mind. The missing object,</text>
<text x="347.3" y="238" font-family="Arial, sans-serif" font-size="11" fill="#52616b">he said, was never truly missing at</text>
<rect x="602.7" y="92" width="253.3" height="170" rx="6" fill="#ffffff" stroke="#d8dee4"/>
<text x="616.7" y="118" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2933">Base prompt plus Salix</text>
<text x="616.7" y="142" font-family="Arial, sans-serif" font-size="11" fill="#52616b">To Sherlock Holmes the missing railway</text>
<text x="616.7" y="158" font-family="Arial, sans-serif" font-size="11" fill="#52616b">ticket was not a trifle, but a small</text>
<text x="616.7" y="174" font-family="Arial, sans-serif" font-size="11" fill="#52616b">fact misplaced among larger ones. I</text>
<text x="616.7" y="190" font-family="Arial, sans-serif" font-size="11" fill="#52616b">have seldom seen him regard so slight a</text>
<text x="616.7" y="206" font-family="Arial, sans-serif" font-size="11" fill="#52616b">paper with such cold attention, for in</text>
<text x="616.7" y="222" font-family="Arial, sans-serif" font-size="11" fill="#52616b">his eyes the little oblong of</text>
<text x="616.7" y="238" font-family="Arial, sans-serif" font-size="11" fill="#52616b">pasteboard eclipsed the whole confusion</text>
<text x="64" y="336" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2933">Overall style distance convergence</text>
<text x="64" y="356" font-family="Arial, sans-serif" font-size="12" fill="#52616b">weighted Salix distance; lower is closer</text>
<line x1="64" y1="504" x2="856" y2="504" stroke="#c9d1d9" stroke-width="1"/>
<line x1="64" y1="366" x2="64" y2="504" stroke="#c9d1d9" stroke-width="1"/>
