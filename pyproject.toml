[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salix-skill"
version = "0.7.0"
description = "Personal writing-style fingerprinting and iterative rewrite skill for Claude Code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "thekozugroup", email = "thekozugroup@gmail.com" }]
keywords = ["writing", "style", "stylometry", "authorship", "claude", "skill", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = []  # pure stdlib

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/thekozugroup/Salix"
Repository = "https://github.com/thekozugroup/Salix"
Changelog = "https://github.com/thekozugroup/Salix/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["lib"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "samples/.gitkeep", "benchmarks/.gitkeep"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignments
    "B007",  # unused loop variable (intentional in stylometric loops)
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
