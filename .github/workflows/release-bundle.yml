name: Release Salix skill bundle

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish at the checked-out commit. Leave blank to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify
        run: |
          python -m unittest discover tests/
          python -m pip install ruff
          python -m ruff check .
      - name: Build release bundles
        run: python scripts/build_skill_bundle.py --release --all
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Salix-release
          path: |
            dist/*.skill
            dist/*.zip
            dist/SHA256SUMS
      - name: Resolve release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            case "$GITHUB_REF" in
              refs/heads/release/*) tag="${GITHUB_REF#refs/heads/release/}" ;;
              *) tag="" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag:-<none, bundle build only>}"
      - name: Attach to GitHub release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.skill
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
